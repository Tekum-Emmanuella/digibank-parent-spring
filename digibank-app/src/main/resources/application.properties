# DigiBank Application Configuration
# Default profile: WildFly deployment via JNDI datasource (java:/jdbc/DigiBankDS)

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Logging
logging.level.root=INFO
logging.level.com.digibank=DEBUG

# Thymeleaf
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Context path (matches jboss-web.xml for WildFly deployment)
server.servlet.context-path=/digibank-app
