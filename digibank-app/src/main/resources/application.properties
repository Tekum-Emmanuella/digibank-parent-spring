# DigiBank Application Configuration

# JNDI DataSource for WildFly deployment
spring.datasource.jndi-name=java:/jdbc/DigiBankDS

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Logging
logging.level.root=INFO
logging.level.com.digibank=DEBUG

# Thymeleaf
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Server configuration (for embedded mode)
server.servlet.context-path=/digibank-app

# --- Local Development Profile (application-local.properties) ---
